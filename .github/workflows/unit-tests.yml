# The gate on the delivery path.
#
# Why it exists: 17 unit tests sat red across 3 suites from June to July 2026
# without blocking anything. The tests were stale, but nobody found out for two
# months because nothing automated ran on the way to production. `yarn
# code-quality` cannot serve as the gate — it chains `yarn lint`, which exits 1 on
# ~9k pre-existing problems, so it never reaches the tests. And the only other
# workflow with a real trigger (test-cli.yml) fires on pull_request, while this
# repo pushes straight to master.
#
# Two jobs on purpose, running in parallel:
#
#   unit        install + test:unit          ~40s   — fast feedback, no build
#   type-check  install + build + tsc        ~150s  — needs generated types
#
# The split keeps the cheap check cheap. A gate people wait on is a gate people
# learn to skip.
#
# Why type-check needs a build at all, which is the interesting part: tsconfig.json
# includes `.medusa/types/*`, and that directory is gitignored — `medusa build`
# generates it (index.d.ts, modules-bindings.d.ts, query-entry-points.d.ts). Without
# it every `container.resolve(...)` widens to `unknown` and tsc reports errors that
# never appear on a developer machine. That is why the first version of this
# workflow went red on untouched code, and it meant the repo's primary declared
# gate was only ever as current as somebody's last local build — not reproducible
# anywhere else, which is how it stayed broken unnoticed.
#
# Every env value below is a deliberate placeholder. The build reads config, it
# does not connect to anything, so no real credential belongs here — and keeping it
# that way is what lets this run on every push without secrets.
#
# Integration tests stay out: they need real services, and a flaky gate loses its
# authority.

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: test:unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      # NOTE: the env var is TEST_TYPE, not TESTS_TYPE. Misspelling it widens
      # jest's testMatch to integration-tests/http/*.spec.ts, which die on a
      # dynamic-import error that looks like a real failure but is not. The
      # `test:unit` script gets it right — always go through the script.
      - name: Unit tests
        run: yarn test:unit

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    env:
      # 127.0.0.1 on purpose: medusa-config disables SSL for localhost, and the
      # build must not reach a real service anyway.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: placeholder-not-a-real-secret
      COOKIE_SECRET: placeholder-not-a-real-secret
      MEILISEARCH_HOST: http://127.0.0.1:7700
      MEILISEARCH_API_KEY: placeholder-not-a-real-secret
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: placeholder-not-a-real-secret
      MINIO_SECRET_KEY: placeholder-not-a-real-secret
      MINIO_BUCKET: placeholder
      AUTHORIZENET_API_LOGIN_ID: placeholder
      AUTHORIZENET_TRANSACTION_KEY: placeholder
      AUTHORIZENET_ENVIRONMENT: sandbox
      SENDGRID_API_KEY: placeholder
      SENDGRID_FROM: noreply@example.invalid
      UPS_CLIENT_ID: placeholder
      UPS_CLIENT_SECRET: placeholder
      UPS_SHIPPER_NAME: placeholder
      UPS_SHIPPER_ADDRESS_LINE1: placeholder
      UPS_SHIPPER_CITY: placeholder
      UPS_SHIPPER_STATE: FL
      UPS_SHIPPER_POSTAL_CODE: "00000"
      UPS_SHIPPER_COUNTRY: US
      GOOGLE_CLIENT_ID: placeholder
      GOOGLE_CLIENT_SECRET: placeholder
      GOOGLE_CALLBACK_URL: http://127.0.0.1/cb
      STORE_CORS: http://127.0.0.1
      ADMIN_CORS: http://127.0.0.1
      AUTH_CORS: http://127.0.0.1
      BACKEND_URL: http://127.0.0.1:9000
      STOREFRONT_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Generates .medusa/types, without which the type-check below is not just
      # weaker but actively wrong — it invents errors.
      - name: Build
        run: yarn build

      - name: Assert the generated types exist
        run: |
          test -f .medusa/types/query-entry-points.d.ts \
            || { echo "::error::.medusa/types missing after build — type-check would report phantom errors"; exit 1; }

      - name: Type-check
        run: yarn type-check
