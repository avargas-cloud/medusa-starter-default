[variables]
NIXPACKS_NODE_VERSION = "20"
NODE_OPTIONS = "--max-old-space-size=4096"

[phases.setup]
nixPkgs = ["nodejs-20_x", "yarn", "python3", "gnumake", "gcc", "g++", "cairo", "pango", "glib"]
# Chromium via apt — aptPkgs persist to the runtime container (unlike build-phase artifacts).
# This is the confirmed working approach for headless Chrome on Railway + nixpacks.
aptPkgs = ["chromium", "libnss3", "libnspr4", "libatk1.0-0", "libatk-bridge2.0-0", "libcups2", "libdrm2", "libxkbcommon0", "libxcomposite1", "libxdamage1", "libxrandr2", "libgbm1", "libasound2", "libx11-6", "libxcb1", "libxext6", "libxfixes3", "fonts-liberation", "ca-certificates"]


[phases.install]
cmds = ["echo '--- INSTALL (yarn) ---'", "yarn install --frozen-lockfile"]

[phases.build]
cmds = [
  "echo '--- PATCH (workspace) ---'",
  "npx patch-package",
  "echo '--- BUILD (medusa) ---'",
  "yarn build",
  "echo '--- RE-PATCH (.medusa/server) ---'",
  "node scripts/post-build.js"
]
