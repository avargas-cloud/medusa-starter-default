[variables]
NIXPACKS_NODE_VERSION = "20"
NODE_OPTIONS = "--max-old-space-size=4096"

[phases.setup]
nixPkgs = ["nodejs-20_x", "yarn", "python3", "gnumake", "gcc", "g++"]

[phases.install]
cmds = ["echo '--- INSTALL (yarn) ---'", "yarn install --frozen-lockfile"]

[phases.build]
# patch-package runs in build phase (never cached) — reliable even when yarn.lock doesn't change.
# Overhead is ~5-10 seconds per deploy, which is acceptable.
cmds = ["npx patch-package", "yarn build"]
